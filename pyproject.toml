[project]
name = "stock-deep-research"
version = "0.1.0"
description = "A deep research report for any Indian listed stock: evidence first, every claim cited, built on the data stock_news_analyzer collects."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "alembic>=1.20.0",
    "typer>=0.12",
    "anthropic>=2.1.0",
    "streamlit>=1.66.0",
    "pandas>=3.0.6",
]

[project.scripts]
sdr = "stock_deep_research.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_deep_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: tests that need a running Postgres (skipped when it is unreachable)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/stock_deep_research/migrations/versions/*" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
